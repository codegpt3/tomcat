name: Publish Corretto AL2023

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and publish even when Tomcat versions have not changed
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: corretto-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      revision: ${{ steps.prepare.outputs.revision }}
      jdk: ${{ steps.prepare.outputs.jdk }}
      jre: ${{ steps.prepare.outputs.jre }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: docker-library/bashbrew@HEAD
      - name: Install template dependencies
        run: sudo apt-get update && sudo apt-get install -y gawk jq
      - name: Check upstream releases and render Dockerfiles
        shell: bash
        run: |
          set -Eeuo pipefail
          ./update.sh 9.0 10.1 11.0
      - name: Commit version updates and prepare build matrix
        id: prepare
        shell: bash
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -Eeuo pipefail
          git add versions.json 9.0 10.1 11.0
          changed=false
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Tomcat versions for Corretto AL2023'
            git push origin HEAD:master
            changed=true
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == true || "$REBUILD" == true ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
          for type in jdk jre; do
            matrix="$(jq -c --arg type "$type" '[to_entries[] as $release | $release.value.variants[] | select(endswith("/corretto-al2023") and startswith($type)) | {directory: ($release.key + "/" + .), tag: ($release.value.version + "-"+ (gsub("/"; "-"))), alias: ($release.key + "-" + (gsub("/"; "-")))}]' versions.json)"
            echo "$type=$matrix" >> "$GITHUB_OUTPUT"
          done

  jdk:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.update.outputs.jdk) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.directory }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/tomcat:${{ matrix.tag }}
            ${{ secrets.DOCKER_USER }}/tomcat:${{ matrix.alias }}

  jre:
    needs: [update, jdk]
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.update.outputs.jre) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.revision }}
      - name: Point JRE build at our published JDK image
        shell: bash
        env:
          DIRECTORY: ${{ matrix.directory }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -Eeuo pipefail
          sed -i "s|COPY --from=tomcat:|COPY --from=${DOCKER_USER}/tomcat:|" "$DIRECTORY/Dockerfile"
          grep -q "COPY --from=${DOCKER_USER}/tomcat:" "$DIRECTORY/Dockerfile"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.directory }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/tomcat:${{ matrix.tag }}
            ${{ secrets.DOCKER_USER }}/tomcat:${{ matrix.alias }}